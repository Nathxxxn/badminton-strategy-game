<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#08121C">
  <meta name="description" content="Hub principal du prototype Badminton Strategy avec parcours guide et laboratoires move, shot et rally.">
  <title>Badminton Strategy Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <noscript>
    <div id="noscript-fallback">
      <h1>Badminton Strategy Lab</h1>
      <p>Le hub principal demande JavaScript. Les prototypes standalone restent accessibles directement :</p>
      <p>
        <a href="move-test.html">Move Test</a>
        <a href="shot-test.html">Shot Test</a>
        <a href="rally-test.html">Rally Test</a>
      </p>
    </div>
  </noscript>

  <div id="app">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="hud" aria-live="polite">
    <div id="hud-level">Niv. <span id="hud-level-num">1</span></div>
    <div id="hud-center">
      <div id="hud-turn">Tour 1 / 4</div>
      <div id="hud-xp-wrap" role="progressbar" aria-label="XP" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div id="hud-xp-bar"></div>
      </div>
    </div>
    <div id="hud-right">
      <div id="hud-timer-wrap" aria-live="polite">
        <span id="hud-timer-label">Timer</span>
        <span id="hud-timer"></span>
      </div>
      <div id="hud-score">0 pts</div>
      <div id="hud-combo"></div>
    </div>
  </div>

  <div id="instruction">
    <div class="label" id="instr-label">Placement</div>
    <div class="text"  id="instr-text">Chargement…</div>
  </div>

  <div id="end-screen">
    <h2 id="end-title">Fin du rally !</h2>
    <p  id="end-score"></p>
    <p  id="end-detail"></p>
    <button id="end-btn" class="btn-primary">Rejouer</button>
  </div>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
