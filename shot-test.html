<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f4ecd8">
  <title>Shot Lab — Rally</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/style.css">
  <style>
    html,
    body {
      overflow: hidden;
    }

    #app.shot-lab-app {
      background: var(--rally-cream);
    }

    #app.shot-lab-app::before {
      z-index: 0;
    }

    .shot-lab-stage-wrap {
      padding: 20px;
    }

    .shot-lab-stage {
      min-height: 0;
    }

    .shot-lab-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255, 248, 225, 0.16);
    }

    .shot-lab-topbar {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 8;
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }

    .shot-lab-chip {
      padding: 8px 10px;
      border: 3px solid var(--rally-ink);
      border-radius: 10px;
      background: var(--rally-feather);
      color: var(--rally-ink);
      box-shadow: 3px 3px 0 0 var(--rally-ink);
      font: 800 11px/1 var(--font-rally-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #tuning-panel {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 8;
      width: min(340px, calc(100% - 32px));
      padding: 14px;
      border: 3px solid var(--rally-ink);
      border-radius: 12px;
      background: rgba(255, 248, 225, 0.94);
      color: var(--rally-ink);
      box-shadow: 4px 4px 0 0 var(--rally-ink);
      font-family: var(--font-rally);
    }

    #tuning-panel h1 {
      margin: 0 0 12px;
      font: 800 14px/1 var(--font-rally-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .lab-control {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .lab-control label {
      color: var(--rally-ink-soft);
      font: 800 10px/1 var(--font-rally-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .lab-control output {
      font: 800 12px/1 var(--font-rally-mono);
    }

    .lab-control input {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--rally-danger);
    }

    .lab-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .lab-stat {
      min-width: 0;
      padding: 9px;
      border: 2px solid var(--rally-ink);
      border-radius: 8px;
      background: var(--rally-cream-2);
    }

    .lab-stat span {
      display: block;
      color: var(--rally-ink-soft);
      font: 800 9px/1 var(--font-rally-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .lab-stat strong {
      display: block;
      min-height: 18px;
      margin-top: 5px;
      overflow: hidden;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lab-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .lab-actions .btn {
      min-height: 36px;
      flex: 1;
      padding: 8px 10px;
      border-width: 2px;
      border-radius: 8px;
      box-shadow: 2px 2px 0 0 var(--rally-ink);
      font-size: 12px;
    }

    .shot-lab-help {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 8;
      max-width: 300px;
      padding: 10px 12px;
      border: 3px solid var(--rally-ink);
      border-radius: 10px;
      background: rgba(15, 26, 20, 0.92);
      color: var(--rally-feather);
      box-shadow: 3px 3px 0 0 var(--rally-accent);
      font: 800 11px/1.35 var(--font-rally-mono);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .shot-lab-stage-wrap {
        padding: 12px;
      }

      #tuning-panel,
      .shot-lab-help {
        position: fixed;
      }

      .shot-lab-help {
        display: none;
      }

      .shot-type-selector {
        right: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="shot-lab-app">
    <div id="game-stage-wrap" class="shot-lab-stage-wrap">
      <div class="stage-row shot-lab-stage-row">
        <div class="stage shot-lab-stage" id="stage">
          <canvas id="game-canvas"></canvas>

          <div class="shot-lab-topbar" aria-hidden="true">
            <span class="shot-lab-chip">Current shot mechanic</span>
            <span class="shot-lab-chip" id="phase-chip">Ready</span>
          </div>

          <div class="shot-type-selector" id="shot-type-selector">
            <button class="shot-type-btn is-active" data-shot-type="SMASH" type="button">SMASH</button>
            <button class="shot-type-btn" data-shot-type="DROP" type="button">DROP</button>
            <button class="shot-type-btn" data-shot-type="DRIVE" type="button">DRIVE</button>
            <button class="shot-type-btn" data-shot-type="CLEAR" type="button">CLEAR</button>
            <button class="shot-type-btn" data-shot-type="KILL" type="button">KILL</button>
            <button class="shot-type-btn" data-shot-type="NET_DROP" type="button">NET DROP</button>
          </div>

          <aside id="tuning-panel" aria-label="Shot tuning lab">
            <h1>Shot lab</h1>
            <div class="lab-control">
              <label for="replay-speed">Replay speed</label>
              <output id="replay-speed-value">1.00x</output>
              <input id="replay-speed" type="range" min="0.5" max="1.75" step="0.05" value="1">
            </div>
            <div class="lab-stats">
              <div class="lab-stat"><span>Shots</span><strong id="shot-count">0</strong></div>
              <div class="lab-stat"><span>Type</span><strong id="last-type">--</strong></div>
              <div class="lab-stat"><span>Power</span><strong id="last-power">--</strong></div>
            </div>
            <div class="lab-stats" style="margin-top:8px">
              <div class="lab-stat"><span>Spin</span><strong id="last-spin">--</strong></div>
              <div class="lab-stat"><span>Impact</span><strong id="last-impact">--</strong></div>
              <div class="lab-stat"><span>Aim</span><strong id="last-aim">--</strong></div>
            </div>
            <div class="lab-actions">
              <button class="btn" id="reset-lab" type="button">Reset</button>
              <button class="btn primary" id="center-lab" type="button">Center</button>
            </div>
          </aside>

          <div class="shot-lab-help">Grab the highlighted impact window, pull back, release, repeat.</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { Court } from './src/js/court.js';
    import { Renderer } from './src/js/renderer.js';
    import { DragShooter } from './src/js/drag.js';
    import { ShotTypeSelector, clampPowerForType } from './src/js/shot-type-selector.js';
    import { loftedCurveControl, sampleLoftedCurvePoint } from './src/js/trajectory.js';

    const RESET_SHUTTLE = Object.freeze({ x: 0.50, y: 0.72 });
    const CENTER_SHUTTLE = Object.freeze({ x: 0.50, y: 0.62 });
    const ALL_SHOT_TYPES = ['SMASH', 'DROP', 'DRIVE', 'CLEAR', 'KILL', 'NET_DROP'];
    const FLIGHT_MS = {
      SMASH: 280,
      DROP: 640,
      DRIVE: 360,
      CLEAR: 760,
      KILL: 240,
      NET_DROP: 520,
    };
    const LAB_DRAG_PROFILES = Object.freeze({
      SMASH: { maxDragPx: 205, deadzonePx: 18, tensionExponent: 1.25, targetYMin: 0.06, targetYMax: 0.42, lineWidthBoost: 1.22, ringBoost: 1.18 },
      DROP: { maxDragPx: 120, deadzonePx: 10, tensionExponent: 0.82, targetYMin: 0.37, targetYMax: 0.49, lineWidthBoost: 0.82, ringBoost: 0.82 },
      DRIVE: { maxDragPx: 145, deadzonePx: 12, tensionExponent: 0.95, targetYMin: 0.18, targetYMax: 0.34, lineWidthBoost: 1.00, ringBoost: 0.96 },
      CLEAR: { maxDragPx: 230, deadzonePx: 20, tensionExponent: 1.45, targetYMin: 0.03, targetYMax: 0.12, lineWidthBoost: 1.34, ringBoost: 1.26 },
      KILL: { maxDragPx: 115, deadzonePx: 12, tensionExponent: 0.72, targetYMin: 0.10, targetYMax: 0.28, lineWidthBoost: 1.28, ringBoost: 1.10 },
      NET_DROP: { maxDragPx: 95, deadzonePx: 8, tensionExponent: 0.68, targetYMin: 0.44, targetYMax: 0.50, lineWidthBoost: 0.72, ringBoost: 0.74 },
    });

    const canvas = document.getElementById('game-canvas');
    const court = new Court(canvas);
    const renderer = new Renderer(canvas, court);
    const phaseChip = document.getElementById('phase-chip');
    const replaySpeed = document.getElementById('replay-speed');
    const replaySpeedValue = document.getElementById('replay-speed-value');
    const readout = {
      count: document.getElementById('shot-count'),
      type: document.getElementById('last-type'),
      power: document.getElementById('last-power'),
      spin: document.getElementById('last-spin'),
      impact: document.getElementById('last-impact'),
      aim: document.getElementById('last-aim'),
    };

    const players = {
      ally1: { x: 0.50, y: 0.82, label: 'YOU' },
      ally2: { x: 0.28, y: 0.68, label: 'ALLY' },
      opponent1: { x: 0.28, y: 0.26, label: 'O1' },
      opponent2: { x: 0.72, y: 0.26, label: 'O2' },
    };

    const lab = {
      shotCount: 0,
      lastShot: null,
      shuttlePos: { ...RESET_SHUTTLE },
      flight: null,
      flightProgress: 0,
      landingUntil: 0,
    };

    const shotTypeSelector = new ShotTypeSelector(
      document.getElementById('shot-type-selector'),
      { onChange: () => armDrag() },
    );
    shotTypeSelector.setAllowedTypes(ALL_SHOT_TYPES);
    shotTypeSelector.reset();
    shotTypeSelector.show();

    const drag = new DragShooter(canvas, court, onShotFired, {
      profiles: LAB_DRAG_PROFILES,
    });

    function buildImpactWindow(center = lab.shuttlePos) {
      return [
        { x: center.x - 0.035, y: center.y - 0.025, t: 0.46 },
        { x: center.x - 0.018, y: center.y - 0.012, t: 0.48 },
        { x: center.x, y: center.y, t: 0.50 },
        { x: center.x + 0.018, y: center.y + 0.012, t: 0.52 },
        { x: center.x + 0.035, y: center.y + 0.025, t: 0.54 },
      ].map(point => ({
        x: Math.max(0.05, Math.min(0.95, point.x)),
        y: Math.max(0.54, Math.min(0.92, point.y)),
        t: point.t,
      }));
    }

    function currentShuttle() {
      const impactPoints = lab.flight ? [] : buildImpactWindow(lab.shuttlePos);
      return {
        position: lab.shuttlePos,
        trajectory: lab.lastShot ? [lab.lastShot.impactPoint, lab.lastShot.aimPoint] : null,
        speed: speedForPower(lab.lastShot?.power ?? 0.5),
        height: 'normal',
        type: lab.lastShot?.type ?? shotTypeSelector.getSelected(),
        validImpactPoints: impactPoints,
      };
    }

    function speedForPower(power) {
      if (power < 0.34) return 'slow';
      if (power < 0.70) return 'medium';
      return 'fast';
    }

    function updateLabReadout() {
      replaySpeedValue.textContent = `${Number(replaySpeed.value).toFixed(2)}x`;
      readout.count.textContent = String(lab.shotCount);
      readout.type.textContent = lab.lastShot?.type ?? '--';
      readout.power.textContent = lab.lastShot ? `${Math.round(lab.lastShot.power * 100)}%` : '--';
      readout.spin.textContent = lab.lastShot ? lab.lastShot.spin.toFixed(2) : '--';
      readout.impact.textContent = lab.lastShot ? formatPoint(lab.lastShot.impactPoint) : '--';
      readout.aim.textContent = lab.lastShot ? formatPoint(lab.lastShot.aimPoint) : '--';
      phaseChip.textContent = lab.flight ? 'Flying' : 'Ready';
    }

    function formatPoint(point) {
      return `${point.x.toFixed(2)},${point.y.toFixed(2)}`;
    }

    function armDrag() {
      if (lab.flight) return;
      drag.setShotType(shotTypeSelector.getSelected());
      shotTypeSelector.show();
      drag.activate(lab.shuttlePos, buildImpactWindow(lab.shuttlePos));
    }

    function resetLab(position = RESET_SHUTTLE) {
      lab.flight = null;
      lab.flightProgress = 0;
      lab.landingUntil = 0;
      lab.shuttlePos = { ...position };
      armDrag();
      updateLabReadout();
    }

    function onShotFired(shot) {
      const type = shotTypeSelector.getSelected();
      const impactPoint = shot.impactPoint ?? { ...lab.shuttlePos };
      const aimPoint = {
        x: Math.max(0, Math.min(1, shot.aimPoint.x)),
        y: Math.max(0, Math.min(1, shot.aimPoint.y)),
      };
      const power = clampPowerForType(shot.power, type);
      const duration = (FLIGHT_MS[type] ?? 450) / Number(replaySpeed.value);

      drag.deactivate();
      shotTypeSelector.hide();
      lab.shotCount += 1;
      lab.lastShot = {
        type,
        power,
        spin: shot.spin,
        impactPoint,
        aimPoint,
      };
      lab.flight = {
        from: impactPoint,
        to: aimPoint,
        type,
        power,
        startedAt: null,
        duration,
      };
      lab.flightProgress = 0;
      updateLabReadout();
    }

    function tickFlight(ts) {
      if (!lab.flight) return;
      const flight = lab.flight;
      if (flight.startedAt === null) flight.startedAt = ts;

      const t = Math.min(1, (ts - flight.startedAt) / flight.duration);
      lab.flightProgress = t;
      const eased = 0.5 - 0.5 * Math.cos(Math.PI * t);
      lab.shuttlePos = isCurvedShot(flight.type)
        ? sampleLoftedCurvePoint(flight.from, flight.to, eased, court, flight.type)
        : {
            x: flight.from.x + (flight.to.x - flight.from.x) * eased,
            y: flight.from.y + (flight.to.y - flight.from.y) * eased,
          };

      if (t >= 1) {
        lab.shuttlePos = { ...RESET_SHUTTLE };
        lab.flight = null;
        lab.flightProgress = 0;
        lab.landingUntil = ts + 180;
        armDrag();
        updateLabReadout();
      }
    }

    function isCurvedShot(type) {
      return type === 'CLEAR' || type === 'DROP' || type === 'NET_DROP';
    }

    function drawGroundedShuttle(point) {
      if (lab.flight || !lab.lastShot) return;

      const ctx = canvas.getContext('2d');
      const pos = court.toCanvas(point.x, point.y);
      const r = Math.max(8, court.courtW * 0.023);
      const corkR = Math.max(3, court.courtW * 0.008);

      ctx.save();
      ctx.globalAlpha = 0.94;

      ctx.beginPath();
      ctx.ellipse(pos.x + 2, pos.y + r * 0.95, r * 1.2, r * 0.32, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(15, 26, 20, 0.22)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 248, 225, 0.82)';
      ctx.fill();
      ctx.strokeStyle = '#0f1a14';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, corkR, 0, Math.PI * 2);
      ctx.fillStyle = '#fff8e1';
      ctx.fill();
      ctx.strokeStyle = '#0f1a14';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }

    function drawLiveShotTrace(fromNorm, toNorm, type, power, alpha) {
      if (alpha <= 0) return;

      const from = court.toCanvas(fromNorm.x, fromNorm.y);
      const to = court.toCanvas(toNorm.x, toNorm.y);
      const points = tracePoints(from, to, type, power);
      const ctx = canvas.getContext('2d');
      const colour = powerColour(power);

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.strokeStyle = colour;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      strokeShotTrace(ctx, points, type);
      ctx.restore();
    }

    function tracePoints(from, to, type, power) {
      return [from, to];
    }

    function strokeShotTrace(ctx, points, type) {
      switch (type) {
        case 'SMASH':
          strokeParallelTrace(ctx, points, 2, 3.5, 1.5);
          break;
        case 'KILL':
          strokeParallelTrace(ctx, points, 3, 2.5, 1.4);
          break;
        case 'CLEAR':
          strokeCurveTrace(ctx, points, [], 2, type);
          break;
        case 'DROP':
          strokeCurveTrace(ctx, points, [8, 6], 1.8, type);
          break;
        case 'NET_DROP':
          strokeCurveTrace(ctx, points, [3, 5], 1.5, type);
          break;
        case 'DRIVE':
        default:
          strokeTracePath(ctx, points, [], 1.8);
          break;
      }
    }

    function strokeCurveTrace(ctx, points, dash, width, type) {
      const start = points[0];
      const end = points[points.length - 1];
      const control = loftedCurveControl(court, start, end, type);

      ctx.setLineDash(dash);
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.quadraticCurveTo(control.x, control.y, end.x, end.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function strokeTracePath(ctx, points, dash, width) {
      ctx.setLineDash(dash);
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      points.slice(1).forEach(point => ctx.lineTo(point.x, point.y));
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function strokeParallelTrace(ctx, points, count, offsetPx, width) {
      const start = points[0];
      const end = points[points.length - 1];
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      const mid = (count - 1) / 2;

      for (let i = 0; i < count; i++) {
        const offset = (i - mid) * offsetPx;
        strokeTracePath(
          ctx,
          points.map(point => ({ x: point.x + nx * offset, y: point.y + ny * offset })),
          [],
          width,
        );
      }
    }

    function powerColour(power) {
      if (power < 0.6) return '#4ade80';
      if (power < 0.8) return '#facc15';
      if (power < 0.92) return '#f97316';
      return '#ef4444';
    }

    function render(ts) {
      tickFlight(ts);
      court.draw();
      renderer.drawScene(players, currentShuttle(), 'ally1');
      if (lab.flight) drawLiveShotTrace(lab.flight.from, lab.flight.to, lab.flight.type, lab.flight.power, 1 - lab.flightProgress);
      if (lab.lastShot) drawGroundedShuttle(lab.lastShot.aimPoint);
      drag.draw();

      if (lab.landingUntil > ts) {
        const ctx = canvas.getContext('2d');
        const marker = court.toCanvas(lab.lastShot.aimPoint.x, lab.lastShot.aimPoint.y);
        const alpha = (lab.landingUntil - ts) / 180;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = '#ffd23f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(marker.x, marker.y, 16 + (1 - alpha) * 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    replaySpeed.addEventListener('input', updateLabReadout);
    document.getElementById('reset-lab').addEventListener('click', () => resetLab(RESET_SHUTTLE));
    document.getElementById('center-lab').addEventListener('click', () => resetLab(CENTER_SHUTTLE));

    court.onGeometryChange(() => {
      armDrag();
    });

    resetLab();
    requestAnimationFrame(render);
  </script>
</body>
</html>
